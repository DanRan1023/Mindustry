name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      branch_or_tag:
        description: 'Branch or tag to build (e.g., master, v7.0, feature/branch)'
        required: true
        default: 'master'
      build_number:
        description: 'Build number (optional, auto-incremented if not provided)'
        required: false
        default: ''

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_or_tag }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: |
          brew install gradle
          which gradle
          gradle --version

      - name: Build iOS IPA
        run: |
          cd ${{ github.workspace }}
          ./gradlew -p ios:ios createIPA \
            -Dbuildversion="${{ steps.build_num.outputs.build_number }}" \
            -DiosSkipSigning=true
        env:
          GRADLE_OPTS: "-Xmx4g"
          JAVA_OPTS: "-Xmx4g"

      - name: Package and upload
        run: |
          mkdir -p ios_build_output
          cp ios/build/robovm/Mindustry.ipa ios_build_output/ || true
          cd ios_build_output && sha256sum *.ipa > SHA256SUMS || true

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: ios_build_output/
          retention-days: 30
