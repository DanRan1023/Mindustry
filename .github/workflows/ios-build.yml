name: Build Mindustry iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to checkout for Mindustry (e.g. main or v1.2.3). Leave empty to use the workflow run ref.'
        required: false
        default: ''
      arc_ref:
        description: 'Optional branch or tag to checkout for Anuken/Arc. Leave empty to use its default branch.'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Print resolved refs
        run: |
          echo "Mindustry ref: ${{ inputs.ref != '' ? inputs.ref : github.ref }}"
          echo "Arc ref: ${{ inputs.arc_ref != '' ? inputs.arc_ref : '(default)'}}"

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          submodules: 'recursive'
          ref: ${{ inputs.ref != '' ? inputs.ref : github.ref }}

      - name: Checkout Arc Engine
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: 'recursive'

      - name: Checkout Arc specified ref (optional)
        if: ${{ inputs.arc_ref != '' }}
        run: |
          set -e
          cd Arc
          # Try to fetch the requested ref (handles tags and branches, shallow or not)
          git fetch --prune origin "${{ inputs.arc_ref }}" || true
          # If fetch didn't fetch (for some remotes), try fetching all and then checkout
          git fetch --prune --unshallow origin "${{ inputs.arc_ref }}" || git fetch origin "${{ inputs.arc_ref }}" || true
          git checkout --detach "${{ inputs.arc_ref }}" || git checkout -b "ci/${{ inputs.arc_ref }}" "${{ inputs.arc_ref }}" || true
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch MetalANGLEKit
        run: |
          TARGET_DIR="Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          echo "Downloading MetalANGLEKit..."
          curl -L -o metalanglekit.zip "https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip"
          unzip -o metalanglekit.zip -d $TARGET_DIR
          rm metalanglekit.zip

      - name: Compile and Inject Arc iOS Natives
        run: |
          cd Arc
          chmod +x ./gradlew
          
          echo "Generating C++ bindings..."
          ./gradlew :arc-core:jnigen
          
          echo "Compiling iOS natives using Xcode..."
          ./gradlew :arc-core:jnigenBuildAllIOS
          
          echo "Injecting compiled natives to RoboVM..."
          TARGET_DIR="backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          
          find . -type d -name "arc.xcframework" -exec cp -R {} $TARGET_DIR/ \; || true
          
          find . -type f -name "*.a" -exec cp {} $TARGET_DIR/ \; || true
          
          ARC_STATIC=$(find $TARGET_DIR -maxdepth 1 -name "libarc*.a" | grep -v "freetype" | head -n 1)
          
          if [ -n "$ARC_STATIC" ] && [ ! -d "$TARGET_DIR/arc.xcframework" ] && [ ! -d "$TARGET_DIR/arc.framework" ]; then
            echo "Wrapping $ARC_STATIC into pseudo framework..."
            mkdir -p $TARGET_DIR/arc.framework
            cp $ARC_STATIC $TARGET_DIR/arc.framework/arc
          fi
          
          echo "=== 检查注入产物 ==="
          ls -la $TARGET_DIR

      - name: Build Unsigned IPA
        run: |
          cd Mindustry
          chmod +x ./gradlew
          
          ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Unsigned
          path: Mindustry/ios/build/robovm/*.ipa
