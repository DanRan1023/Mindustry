name: Build Mindustry iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or tag) of the Mindustry repo to build, e.g. "main" or "v1.2.3". Leave empty to use the default workflow ref.'
        required: false
        default: ''
      arc_ref:
        description: 'Optional Git ref (branch or tag) for the Anuken/Arc repo. Leave empty to use its default branch.'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry (specific ref)
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v4
        with:
          path: Mindustry
          submodules: 'recursive'
          ref: ${{ inputs.ref }}

      - name: Checkout Mindustry (default)
        if: ${{ inputs.ref == '' }}
        uses: actions/checkout@v4
        with:
          path: Mindustry
          submodules: 'recursive'

      - name: Checkout Arc Engine (specific ref)
        if: ${{ inputs.arc_ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: 'recursive'
          ref: ${{ inputs.arc_ref }}

      - name: Checkout Arc Engine (default)
        if: ${{ inputs.arc_ref == '' }}
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch MetalANGLEKit
        run: |
          TARGET_DIR="Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          echo "Downloading MetalANGLEKit..."
          curl -L -o metalanglekit.zip "https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip"
          unzip -o metalanglekit.zip -d $TARGET_DIR
          rm metalanglekit.zip

      - name: Compile and Inject Arc iOS Natives
        run: |
          cd Arc
          chmod +x ./gradlew
          
          echo "Generating C++ bindings..."
          ./gradlew :arc-core:jnigen
          
          echo "Compiling iOS natives using Xcode..."
          ./gradlew :arc-core:jnigenBuildAllIOS
          
          echo "Injecting compiled natives to RoboVM..."
          TARGET_DIR="backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          
          # Copy from the jnigen build output directory
          BUILD_OUTPUT_DIR="arc-core/build/natives"
          if [ -d "$BUILD_OUTPUT_DIR" ]; then
            echo "Copying native libraries from build output..."
            find "$BUILD_OUTPUT_DIR" -type f -name "*.a" -exec cp {} $TARGET_DIR/ \;
            find "$BUILD_OUTPUT_DIR" -type d -name "*.xcframework" -exec cp -R {} $TARGET_DIR/ \; || true
          fi
          
          # Also copy xcframework if present elsewhere
          find . -type d -name "arc.xcframework" -exec cp -R {} $TARGET_DIR/ \; || true
          
          echo "=== 检查所有复制的库文件 ==="
          ls -la $TARGET_DIR
          
          echo "验证必要的库文件..."
          [ -f "$TARGET_DIR/libarc-freetype.a" ] && echo "✓ freetype found" || echo "✗ freetype missing"
          [ -f "$TARGET_DIR/libarc-core.a" ] && echo "✓ core found" || echo "✗ core missing"
          
          # Fail if core library is missing
          if [ ! -f "$TARGET_DIR/libarc-core.a" ]; then
            echo "ERROR: libarc-core.a not found!"
            echo "Available files in $TARGET_DIR:"
            ls -la $TARGET_DIR
            exit 1
          fi

      - name: Build Unsigned IPA
        run: |
          cd Mindustry
          chmod +x ./gradlew
          
          ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Unsigned
          path: Mindustry/ios/build/robovm/*.ipa
