name: Build Mindustry iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      mindustry_ref:
        description: 'Mindustry 版本 (分支名/Tag/Commit，例如 master, v146)'
        required: true
        default: 'master'
        type: string
      arc_ref:
        description: 'Arc 引擎版本 (请与游戏版本匹配，例如 master, v146)'
        required: true
        default: 'master'
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          submodules: 'recursive'
          ref: ${{ inputs.mindustry_ref }}

      - name: Checkout Arc Engine
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: 'recursive'
          ref: ${{ inputs.arc_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch MetalANGLEKit
        run: |
          cd Arc
          chmod +x ./gradlew
          # 唤醒沉睡的官方下载任务！
          ./gradlew :backends:backend-robovm:extractMetalANGLEKit

      - name: Compile and Inject Arc iOS Natives
        run: |
          cd Arc
          chmod +x ./gradlew
          
          echo "Generating and compiling Core C++ bindings..."
          ./gradlew :arc-core:jnigen
          ./gradlew :arc-core:jnigenBuildAllIOS
          
          echo "Generating and compiling Freetype C++ bindings..."
          ./gradlew :extensions:freetype:jnigen
          ./gradlew :extensions:freetype:jnigenBuildAllIOS
          
          echo "Injecting compiled natives to RoboVM..."
          TARGET_DIR="backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          
          XCFRAMEWORK=$(find . -type d -name "arc.xcframework" | head -n 1)
          if [ -n "$XCFRAMEWORK" ]; then
            cp -R "$XCFRAMEWORK" $TARGET_DIR/arc.xcframework
          else
            ARC_A=$(find . -type f -name "libarc*.a" | grep -v "freetype" | grep -v -i "simulator" | head -n 1)
            if [ -n "$ARC_A" ]; then
              mkdir -p $TARGET_DIR/arc.framework
              cp "$ARC_A" $TARGET_DIR/arc.framework/arc
            fi
          fi
          
          mkdir -p ../Mindustry/ios/libs
          FREETYPE_A=$(find . -type f -name "libarc-freetype.a" | grep -v -i "simulator" | head -n 1)
          if [ -z "$FREETYPE_A" ]; then
            FREETYPE_A=$(find . -type f -name "libarc-freetype.a" | head -n 1)
          fi
          
          if [ -n "$FREETYPE_A" ]; then
            cp "$FREETYPE_A" ../Mindustry/ios/libs/libarc-freetype.a
          else
            echo "❌ Freetype .a not found! Build failed."
            exit 1
          fi

      - name: Generate Game Assets (For Old Versions)
        run: |
          cd Mindustry
          chmod +x ./gradlew
          for i in 1 2 3; do
            ./gradlew pack --no-daemon && echo "Assets packed!" && break || echo "Pack attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then
              echo "Failed to pack assets after 3 attempts!"
              exit 1
            fi
          done

      - name: Build and Package IPA
        run: |
          cd Mindustry
          chmod +x ./gradlew
          
          echo "Syncing game assets to iOS directory..."
          rm -rf ios/assets
          cp -a core/assets ios/assets
          
          echo "Building the iOS App..."
          ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true --no-daemon
          
          echo "Hunting for generated files..."
          EXISTING_IPA=$(find . -type f -name "*.ipa" | head -n 1)
          
          if [ -n "$EXISTING_IPA" ]; then
            echo "RoboVM actually generated an IPA at: $EXISTING_IPA"
            # 【修复套娃】将生成的 ipa 移动到上一级的根目录，并重命名
            mv "$EXISTING_IPA" ../Mindustry-iOS.ipa
          else
            echo "No IPA found. Hunting for .app to manually package..."
            APP_DIR=$(find . -type d -name "*.app" | head -n 1)
            
            if [ -n "$APP_DIR" ]; then
              echo "Found App: $APP_DIR"
              mkdir -p Payload
              cp -a "$APP_DIR" Payload/
              # 【修复套娃】将压缩好的 ipa 直接输出到上一级的根目录
              zip -r -q -y ../Mindustry-iOS.ipa Payload
              echo "✅ IPA manually packaged successfully!"
            else
              echo "❌ .app folder not found! Build failed silently."
              exit 1
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-${{ inputs.mindustry_ref }}-Unsigned
          # 【修复套娃】只上传根目录下的这一个文件，下载解压后就不会有烦人的嵌套文件夹了
          path: Mindustry-iOS.ipa
