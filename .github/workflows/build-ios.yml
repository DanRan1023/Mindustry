name: Build Mindustry iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      mindustry_ref:
        description: 'Mindustry 版本 (分支名/Tag/Commit，例如 master, v146)'
        required: true
        default: 'master'
        type: string
      arc_ref:
        description: 'Arc 引擎版本 (请与游戏版本匹配，例如 master, v146)'
        required: true
        default: 'master'
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          submodules: 'recursive'
          ref: ${{ inputs.mindustry_ref }}

      - name: Checkout Arc Engine
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: 'recursive'
          ref: ${{ inputs.arc_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch MetalANGLEKit
        run: |
          TARGET_DIR="Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          echo "Downloading MetalANGLEKit..."
          curl -L -o metalanglekit.zip "https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip"
          unzip -o metalanglekit.zip -d $TARGET_DIR
          rm metalanglekit.zip

      # 5. 【终极绝杀】调用 Xcode 在云端现场编译底层 C++ 代码，生成 arc.xcframework！
      - name: Compile and Inject Arc iOS Natives
        run: |
          cd Arc
          chmod +x ./gradlew
          
          echo "Generating and compiling Core C++ bindings..."
          ./gradlew :arc-core:jnigen
          ./gradlew :arc-core:jnigenBuildAllIOS
          
          echo "Generating and compiling Freetype C++ bindings..."
          ./gradlew :extensions:freetype:jnigen
          ./gradlew :extensions:freetype:jnigenBuildAllIOS
          
          echo "Injecting compiled natives to RoboVM..."
          TARGET_DIR="backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          
          # 处理主引擎 (arc-core)
          XCFRAMEWORK=$(find . -type d -name "arc.xcframework" | head -n 1)
          if [ -n "$XCFRAMEWORK" ]; then
            echo "Found Core xcframework: $XCFRAMEWORK"
            cp -R "$XCFRAMEWORK" $TARGET_DIR/arc.xcframework
          else
            # 兼容老版本：找真机版 .a 并封装成 framework
            ARC_A=$(find . -type f -name "libarc*.a" | grep -v "freetype" | grep -v -i "simulator" | head -n 1)
            if [ -n "$ARC_A" ]; then
              echo "Found Core static lib: $ARC_A"
              mkdir -p $TARGET_DIR/arc.framework
              cp "$ARC_A" $TARGET_DIR/arc.framework/arc
            fi
          fi
          
          # 处理字体引擎 (freetype)
          echo "Injecting Freetype to Mindustry ios/libs..."
          mkdir -p ../Mindustry/ios/libs
          
          # 终极放宽：全图搜索 libarc-freetype.a，剔除模拟器版本
          FREETYPE_A=$(find . -type f -name "libarc-freetype.a" | grep -v -i "simulator" | head -n 1)
          
          # 兜底：如果上面的 grep 不小心过滤空了，直接拿第一个
          if [ -z "$FREETYPE_A" ]; then
            FREETYPE_A=$(find . -type f -name "libarc-freetype.a" | head -n 1)
          fi
          
          if [ -n "$FREETYPE_A" ]; then
            echo "Found Freetype library at: $FREETYPE_A"
            cp "$FREETYPE_A" ../Mindustry/ios/libs/libarc-freetype.a
            echo "✅ Freetype library copied successfully!"
          else
            echo "❌ Freetype .a not found! Check directory contents:"
            find . -name "*.a"
            exit 1
          fi

      # 6. 【新增补丁】专门为打包旧版本准备的贴图生成任务（带重试机制）
      - name: Generate Game Assets (For Old Versions)
        run: |
          cd Mindustry
          chmod +x ./gradlew
          
          echo "Starting asset packing..."
          # 设置最大重试 3 次，防止生成器多线程 I/O 竞争导致随机报错
          for i in 1 2 3; do
            echo "Attempt $i to pack assets..."
            # 加上 --no-daemon 避免守护进程缓存问题
            ./gradlew pack --no-daemon && echo "Assets packed successfully!" && break || echo "Pack attempt $i failed, retrying..."
            
            if [ $i -eq 3 ]; then
              echo "Failed to pack assets after 3 attempts!"
              exit 1
            fi
          done

      # 7. 开始编译与手动封包
      - name: Build Unsigned IPA
        run: |
          cd Mindustry
          chmod +x ./gradlew
          
          # 同步完整素材给 iOS 打包目录
          echo "Syncing game assets to iOS directory..."
          rm -rf ios/assets
          cp -a core/assets ios/assets
          
          echo "Building the iOS App..."
          # 编译 iOS 版本，由于跳过签名，它只会生成一个 .app 文件夹
          ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true --no-daemon
          
          echo "Manually packaging .app into .ipa..."
          cd ios/build/robovm
          
          # 在当前输出目录寻找编译好的 .app 文件夹 (如 IOSLauncher.app)
          APP_DIR=$(find . -type d -name "*.app" | head -n 1)
          
          if [ -n "$APP_DIR" ]; then
            echo "Found App: $APP_DIR"
            # IPA 封包的物理真理：创建一个 Payload 文件夹，把 .app 塞进去，然后 zip 压缩
            mkdir -p Payload
            cp -a "$APP_DIR" Payload/
            zip -r Mindustry-Unsigned.ipa Payload > /dev/null
            echo "✅ IPA manually packaged successfully!"
          else
            echo "❌ .app folder not found! Build failed somewhere."
            ls -R .
            exit 1
          fi
