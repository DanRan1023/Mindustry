name: Build Mindustry iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      mindustry_ref:
        description: 'Mindustry 版本 (分支名/Tag/Commit，例如 master, v146)'
        required: true
        default: 'master'
        type: string
      arc_ref:
        description: 'Arc 引擎版本 (请与游戏版本匹配，例如 master, v146)'
        required: true
        default: 'master'
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          submodules: 'recursive'
          ref: ${{ inputs.mindustry_ref }}

      - name: Checkout Arc Engine
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: 'recursive'
          ref: ${{ inputs.arc_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch MetalANGLEKit
        run: |
          TARGET_DIR="Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          echo "Downloading MetalANGLEKit..."
          curl -L -o metalanglekit.zip "https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip"
          unzip -o metalanglekit.zip -d $TARGET_DIR
          rm metalanglekit.zip

      # 5. 【终极绝杀】调用 Xcode 在云端现场编译底层 C++ 代码，生成 arc.xcframework！
      - name: Compile and Inject Arc iOS Natives
        run: |
          cd Arc
          chmod +x ./gradlew
          
          echo "Generating and compiling Core C++ bindings..."
          ./gradlew :arc-core:jnigen
          ./gradlew :arc-core:jnigenBuildAllIOS
          
          # 【新增】连带编译 Freetype 字体渲染引擎的 C++ 代码
          echo "Generating and compiling Freetype C++ bindings..."
          ./gradlew :extensions:freetype:jnigen
          ./gradlew :extensions:freetype:jnigenBuildAllIOS
          
          echo "Injecting compiled natives to RoboVM..."
          TARGET_DIR="backends/backend-robovm/res/META-INF/robovm/ios/libs"
          mkdir -p $TARGET_DIR
          
          # 在整个 Arc 源码树中全局搜索生成的 iOS 框架，并拷贝
          find . -type d -name "arc.xcframework" -exec cp -R {} $TARGET_DIR/ \; || true
          
          # 在整个 Arc 源码树中全局搜索生成的静态库 .a，并全部拷贝
          find . -type f -name "*.a" -exec cp {} $TARGET_DIR/ \; || true
          
          # 提取刚编译好的主引擎库
          ARC_STATIC=$(find $TARGET_DIR -maxdepth 1 -name "libarc*.a" | grep -v "freetype" | head -n 1)
          
          # 制作伪装框架壳：将静态库强行伪装成 Linker 要求的 arc.framework
          if [ -n "$ARC_STATIC" ] && [ ! -d "$TARGET_DIR/arc.xcframework" ] && [ ! -d "$TARGET_DIR/arc.framework" ]; then
            echo "Wrapping $ARC_STATIC into pseudo framework..."
            mkdir -p $TARGET_DIR/arc.framework
            cp $ARC_STATIC $TARGET_DIR/arc.framework/arc
          fi
          
          # 【新增】将新鲜出炉的 libarc-freetype.a 移交给 Mindustry 游戏主体的打包器
          echo "Injecting Freetype to Mindustry ios/libs..."
          mkdir -p ../Mindustry/ios/libs
          # 找到刚编译出的 Freetype 静态库（排除掉不能在真机运行的模拟器版 simulator）
          FREETYPE_A=$(find extensions/freetype -type f -name "libarc-freetype.a" | grep -v "simulator" | head -n 1)
          if [ -z "$FREETYPE_A" ]; then
            FREETYPE_A=$(find extensions/freetype -type f -name "libarc-freetype.a" | head -n 1)
          fi
          if [ -n "$FREETYPE_A" ]; then
            cp "$FREETYPE_A" ../Mindustry/ios/libs/libarc-freetype.a
            echo "✅ Freetype library copied successfully."
          fi
          
          echo "=== 检查注入产物 ==="
          ls -la $TARGET_DIR
          ls -la ../Mindustry/ios/libs || true

      # 6. 【新增补丁】专门为打包旧版本准备的贴图生成任务（带重试机制）
      - name: Generate Game Assets (For Old Versions)
        run: |
          cd Mindustry
          chmod +x ./gradlew
          
          echo "Starting asset packing..."
          # 设置最大重试 3 次，防止生成器多线程 I/O 竞争导致随机报错
          for i in 1 2 3; do
            echo "Attempt $i to pack assets..."
            # 加上 --no-daemon 避免守护进程缓存问题
            ./gradlew pack --no-daemon && echo "Assets packed successfully!" && break || echo "Pack attempt $i failed, retrying..."
            
            if [ $i -eq 3 ]; then
              echo "Failed to pack assets after 3 attempts!"
              exit 1
            fi
          done

      # 7. 开始编译 IPA
      - name: Build Unsigned IPA
        run: |
          cd Mindustry
          # 直接调用 RoboVM 编译 iOS 版本，并强制跳过签名检测
          ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true --no-daemon

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-${{ inputs.mindustry_ref }}-Unsigned
          path: Mindustry/ios/build/robovm/*.ipa
